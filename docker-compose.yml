version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eyeson_postgres
    environment:
      POSTGRES_USER: eyeson
      POSTGRES_PASSWORD: eyeson_password
      POSTGRES_DB: eyeson_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eyeson_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyeson"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eyeson_backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://eyeson:eyeson_password@postgres:5432/eyeson_db
      JWT_SECRET: eyeson_secret_key_change_in_production
      JWT_EXPIRY: 7d
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eyeson_network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eyeson_frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_APP_NAME: EYESON
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - eyeson_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: eyeson_admin
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - eyeson_network
    volumes:
      - ./admin:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:

networks:
  eyeson_network:
    driver: bridge
